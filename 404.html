<!-- Self-contained: styles are inlined so this page renders correctly at any

<style>

    :root { --bg:#15171a; --ink:#e7e4de; --muted:#9aa1a9; --accent:#a3bccb;

  body { margin:0; background:var(--bg); color:var(--ink);

    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; font-size:0.8rem;
    letter-spacing:0.08em; text-transform:uppercase; padding:0.45rem 1rem; border-bottom:1px solid var(--rule); }
  main { max-width:46rem; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
  h1 { font-size:1.6rem; margin:1rem 0 0.6rem; }
  p { font-size:1.05rem; color:var(--ink); }
  a { color:var(--accent); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  footer { max-width:46rem; margin:0 auto; padding:1.2rem 1.25rem 2.5rem; border-top:1px solid var(--rule);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; font-size:0.8rem; color:var(--muted); }
</style>
</head>
